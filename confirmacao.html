<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento Confirmado - RH Sem Limites</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-4">
          <div class="card-body">
            
            <!-- Ícone de Sucesso -->
            <div class="mb-3 text-success">
              <i class="bi bi-check-circle-fill display-1"></i>
            </div>

            <h2 class="card-title fw-bold mb-3">Pagamento Recebido!</h2>
            <p class="card-text text-muted">
              Agradecemos a confiança. O seu pedido foi processado com sucesso pela <strong>RH Sem Limites</strong>.
            </p>

            <div class="alert alert-info text-start my-4" role="alert">
              <i class="bi bi-info-circle me-2"></i>
              Enviamos os detalhes do seu plano e os próximos passos para o seu e-mail cadastrado.
            </div>

            <!-- Botões de Ação -->
            <div class="d-grid gap-2">
              <a href="https://wa.me/5549999999999?text=Olá,%20acabei%20de%20efetuar%20o%20pagamento%20do%20meu%20plano." 
                 class="btn btn-success btn-lg" target="_blank">
                <i class="bi bi-whatsapp me-2"></i> Falar com Suporte no WhatsApp
              </a>
              <a href="index.html" class="btn btn-outline-secondary">
                Voltar para a Página Inicial
              </a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
