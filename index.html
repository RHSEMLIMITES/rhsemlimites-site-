<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RH Sem Limites</title>
  <style>
    :root {
      --primary: #1a5f7a;
      --primary-dark: #134255;
      --accent: #2e7d32;
      --bg-color: #f7f5f0;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --border-color: #e2ddd5;
      --focus-outline: #2a75d3;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 480px;
      margin: 20px auto;
      background: var(--card-bg);
      padding: 25px 20px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      text-align: center;
      width: 90%;
      box-sizing: border-box;
      border: 1px solid var(--border-color);
    }

    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    .logo-img {
      max-width: 200px;
      width: 100%;
      height: auto;
    }

    h1 {
      color: var(--accent);
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      font-size: 1.05rem;
      border: none;
      border-radius: 8px;
      box-sizing: border-box;
      cursor: pointer;
      transition: background 0.3s;
      text-decoration: none;
      text-align: center;
    }

    .btn-secundario {
      background-color: transparent;
      color: var(--primary-dark);
      border: 2px solid var(--primary);
    }

    .btn:hover, .btn:focus {
      background-color: var(--primary-dark);
      color: white;
      outline: 3px solid var(--focus-outline);
    }

    .box-opcao {
      background: #faf8f5;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 18px;
      margin-top: 14px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 4px;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .radios-tipo {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .radios-tipo label {
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      margin-top: auto;
      padding: 16px;
      text-align: center;
      background-color: #ffffff;
      border-top: 1px solid var(--border-color);
    }

    .link-sub {
      color: var(--primary);
      text-decoration: underline;
      font-weight: bold;
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      padding: 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<main class="container">
  <!-- LOGOTIPO OFICIAL (logo.jpg) -->
  <div class="logo-container">
    <img src="logo.jpg" alt="Logotipo da RH Sem Limites com a árvore da diversidade e seus frutos coloridos" class="logo-img">
  </div>

  <h1>BEM-VINDO À RH SEM LIMITES</h1>

  <!-- BOTÕES PRINCIPAIS -->
  <div class="btn-group">
    <button type="button" id="btnLogin" class="btn" aria-expanded="false" onclick="mostrarLogin()">Fazer Login</button>
    <button type="button" id="btnPrimeiroAcesso" class="btn btn-secundario" aria-expanded="false" onclick="mostrarPrimeiroAcesso()">Primeiro Acesso / Cadastre-se</button>
  </div>

  <!-- PAINEL DE LOGIN -->
  <div id="boxLogin" class="box-opcao hidden" role="region" aria-label="Formulário de Login">
    <h3>Acesse sua conta</h3>
    <div class="radios-tipo">
      <label><input type="radio" name="tipoLogin" value="candidato" checked onchange="mudarFormLogin('candidato')"> Candidato</label>
      <label><input type="radio" name="tipoLogin" value="empresa" onchange="mudarFormLogin('empresa')"> Empresa (CNPJ)</label>
    </div>

    <form id="formLogin" onsubmit="acaoLogin(event)">
      <div class="form-group" id="groupUsuario">
        <label for="campoUsuario" id="labelUsuario">E-mail ou CPF do Candidato *</label>
        <input type="text" id="campoUsuario" required aria-required="true">
      </div>

      <div class="form-group">
        <label for="campoSenha">Senha *</label>
        <input type="password" id="campoSenha" required aria-required="true">
      </div>

      <button type="submit" class="btn">Entrar</button>
    </form>
  </div>

  <!-- PAINEL DE PRIMEIRO ACESSO -->
  <div id="boxPrimeiroAcesso" class="box-opcao hidden" role="region" aria-label="Opções de Cadastro">
    <h3>Escolha como deseja se cadastrar:</h3>
    <div class="btn-group" style="margin-top: 14px;">
      <a href="candidato.html" id="linkCadCandidato" class="btn">Sou Candidato (Pessoa Física)</a>
      <a href="empresa.html" class="btn btn-secundario">Sou Empresa / Contratante (CNPJ)</a>
    </div>
  </div>
</main>

<footer>
  <p>Dúvidas, suporte ou parcerias? <button type="button" class="link-sub" onclick="abrirFaleConosco()">Fale Conosco</button></p>
  <p style="margin-top: 8px; font-size: 0.85rem;"><button type="button" class="link-sub" style="font-size: 0.85rem; color: #666;" onclick="abrirAdmin()">🔒 Área Restrita / ADM</button></p>
</footer>

<!-- MODAL FALE CONOSCO -->
<div id="modalFaleConosco" class="box-opcao hidden" role="dialog" aria-modal="true" aria-label="Fale Conosco" style="position: fixed; top: 10%; left: 5%; right: 5%; max-width: 450px; margin: auto; background: white; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
  <h3>Fale Conosco - RH Sem Limites</h3>
  <form action="https://formsubmit.co/rhsemlimites2024@gmail.com" method="POST">
    <input type="hidden" name="_subject" value="Novo Contato pelo Site - RH Sem Limites">
    <input type="hidden" name="_captcha" value="false">
    
    <div class="form-group">
      <label for="nomeContato">Nome *</label>
      <input type="text" id="nomeContato" name="name" required>
    </div>
    <div class="form-group">
      <label for="emailContato">E-mail *</label>
      <input type="email" id="emailContato" name="email" required>
    </div>
    <div class="form-group">
      <label for="whatsContato">WhatsApp *</label>
      <input type="tel" id="whatsContato" name="whatsapp" required>
    </div>
    <div class="form-group">
      <label for="msgContato">Mensagem *</label>
      <input type="text" id="msgContato" name="message" required>
    </div>
    <button type="submit" class="btn">Enviar Mensagem</button>
    <button type="button" class="btn btn-secundario" style="margin-top: 8px;" onclick="fecharFaleConosco()">Fechar</button>
  </form>
</div>

<!-- MODAL ADMIN / ADM -->
<div id="modalAdmin" class="box-opcao hidden" role="dialog" aria-modal="true" aria-label="Acesso Restrito Administrador" style="position: fixed; top: 15%; left: 5%; right: 5%; max-width: 400px; margin: auto; background: white; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
  <h3>Acesso Restrito - Administrador</h3>
  <form onsubmit="acessarPainelAdmin(event)">
    <div class="form-group">
      <label for="senhaAdmin">Senha de Acesso ADM *</label>
      <input type="password" id="senhaAdmin" placeholder="Digite a senha" required>
    </div>
    <button type="submit" class="btn" style="background-color: var(--primary-dark);">Entrar no ADM</button>
    <button type="button" class="btn btn-secundario" style="margin-top: 8px;" onclick="fecharAdmin()">Cancelar</button>
  </form>
</div>

<script>
  function mostrarLogin() {
    document.getElementById('boxLogin').classList.remove('hidden');
    document.getElementById('boxPrimeiroAcesso').classList.add('hidden');
    document.getElementById('btnLogin').setAttribute('aria-expanded', 'true');
    document.getElementById('btnPrimeiroAcesso').setAttribute('aria-expanded', 'false');
    document.getElementById('campoUsuario').focus();
  }

  function mostrarPrimeiroAcesso() {
    document.getElementById('boxPrimeiroAcesso').classList.remove('hidden');
    document.getElementById('boxLogin').classList.add('hidden');
    document.getElementById('btnPrimeiroAcesso').setAttribute('aria-expanded', 'true');
    document.getElementById('btnLogin').setAttribute('aria-expanded', 'false');
    document.getElementById('linkCadCandidato').focus();
  }

  function mudarFormLogin(tipo) {
    const labelUsuario = document.getElementById('labelUsuario');
    const campoUsuario = document.getElementById('campoUsuario');
    if (tipo === 'empresa') {
      labelUsuario.innerText = 'CNPJ da Empresa *';
      campoUsuario.placeholder = '00.000.000/0000-00';
    } else {
      labelUsuario.innerText = 'E-mail ou CPF do Candidato *';
      campoUsuario.placeholder = '';
    }
  }

  function acaoLogin(e) {
    e.preventDefault();
    const tipo = document.querySelector('input[name="tipoLogin"]:checked').value;
    alert('Login efetuado com sucesso!');
    if (tipo === 'empresa') {
      window.location.href = 'painel-empresa.html';
    } else {
      window.location.href = 'painel-candidato.html';
    }
  }

  function abrirFaleConosco() {
    document.getElementById('modalFaleConosco').classList.remove('hidden');
    document.getElementById('nomeContato').focus();
  }

  function fecharFaleConosco() {
    document.getElementById('modalFaleConosco').classList.add('hidden');
  }

  function abrirAdmin() {
    document.getElementById('modalAdmin').classList.remove('hidden');
    document.getElementById('senhaAdmin').focus();
  }

  function fecharAdmin() {
    document.getElementById('modalAdmin').classList.add('hidden');
    document.getElementById('senhaAdmin').value = '';
  }

  function acessarPainelAdmin(e) {
    e.preventDefault();
    const senha = document.getElementById('senhaAdmin').value;
    if (senha === 'admin123' || senha === 'rhsemlimites' || senha === '123456') {
      alert('Acesso autorizado! Bem-vindo ao painel do Administrador.');
      window.location.href = 'painel-administrador.html';
    } else {
      alert('Senha incorreta. Tente novamente.');
      document.getElementById('senhaAdmin').value = '';
      document.getElementById('senhaAdmin').focus();
    }
  }
</script>

</body>
</html>
